<style>
:root{--acc:#00e5ff;--rgb:0,229,255;--acc2:#b46bff;--bg:#03050d;--txt:#d6f4ff;--dim:#7fa3b5;--glass:rgba(7,13,30,.74);--blur:14px;--ok:#39ff88;--warn:#ffb300;--bad:#ff4d5e;

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:76px 1fr;grid-template-rows:46px 1fr;grid-template-areas:"top top" "dock main";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.tb .dn{flex:1;min-width:120px}.cname{font:700 13px var(--fm);color:var(--acc);min-width:34px;text-align:center}.fx{flex:1;min-width:140px}

.paper{flex:1;overflow:auto;padding:20px clamp(12px,5vw,64px)}
.doc{min-height:100%;outline:none;font-size:18px;line-height:1.65;caret-color:var(--acc)}
.doc h1{font:700 28px var(--fd);color:var(--acc);margin:.3em 0}.doc h2{font:700 21px var(--fd);color:var(--acc2);margin:.4em 0}.doc h3{font:600 17px var(--fd);margin:.4em 0}
.doc blockquote{border-left:3px solid var(--acc);margin:.6em 0;padding-left:14px;color:var(--dim)}
.sheet{flex:1;overflow:auto}.sheet table{border-collapse:separate;border-spacing:0;font:13px var(--fm)}
.sheet th{position:sticky;top:0;background:#0a1530;z-index:2;color:var(--acc);font-weight:600;padding:5px 0;min-width:88px;border-right:1px solid rgba(var(--rgb),.15);border-bottom:1px solid rgba(var(--rgb),.28)}
.sheet th.c{left:0;z-index:4;min-width:40px}.sheet tbody th{top:auto;left:0;z-index:1;min-width:40px;background:#081028}
.sheet td{padding:0;border-right:1px solid rgba(var(--rgb),.1);border-bottom:1px solid rgba(var(--rgb),.1)}
.sheet td input{width:88px;border:0;background:transparent;padding:6px 7px;outline:none;font:inherit;display:block}
.sheet td input:focus{background:rgba(var(--rgb),.16);box-shadow:inset 0 0 0 2px var(--acc)}
.sheet td.num input{text-align:right;color:#aef3ff}.sheet td.err input{color:var(--bad)}
.calc{flex:1;display:flex;flex-direction:column;padding:12px;gap:10px;min-height:0;outline:none;overflow:auto}
.cd{background:rgba(0,0,0,.4);border:1px solid rgba(var(--rgb),.28);border-radius:10px;padding:8px 14px 10px;text-align:right;font-family:var(--fm);position:relative;flex:none}
.cd .ch{color:var(--dim);font-size:13px;min-height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cd .cr{font-size:clamp(26px,7vw,38px);overflow-x:auto;white-space:nowrap;text-shadow:0 0 14px rgba(var(--rgb),.5);scrollbar-width:none}
.cd .cm{position:absolute;left:8px;top:8px;display:flex;gap:5px}
.cd .cm button{font:600 10px var(--fm);padding:2px 7px;border-radius:5px;background:rgba(var(--rgb),.08);border:1px solid rgba(var(--rgb),.3)}
.cd .cm button.on{background:var(--acc);color:#001018}
.cx{display:grid;gap:8px}.cx.sci{grid-template-columns:repeat(6,1fr);display:none;flex:none}.calc.s .cx.sci{display:grid}
.cx.main{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(44px,1fr);flex:1;min-height:0}
.cx button{background:rgba(var(--rgb),.07);border:1px solid rgba(var(--rgb),.22);border-radius:10px;font:500 20px var(--fm);transition:.12s;min-height:38px}
.cx button:hover{background:rgba(var(--rgb),.22)}.cx button:active{transform:scale(.95)}
.cx button.f{font-size:14px;color:var(--acc2)}.cx button.op{color:var(--acc);background:rgba(var(--rgb),.14)}
.cx button.eq{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#001018;font-weight:700;border:0}.cx button.ac{color:var(--bad)}
.scroll{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.hero .he{font-size:76px;filter:drop-shadow(0 0 18px rgba(var(--rgb),.55))}
.hero .ht{font:900 clamp(38px,8vw,58px) var(--fd);text-shadow:0 0 20px rgba(var(--rgb),.5);line-height:1}.hero .hd{font-size:20px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.stats div{background:rgba(var(--rgb),.07);border:1px solid rgba(var(--rgb),.2);border-radius:10px;padding:8px 10px}
.stats small{display:block;color:var(--dim)}.stats b{font:600 17px var(--fm)}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.fc div{text-align:center;background:rgba(var(--rgb),.07);border:1px solid rgba(var(--rgb),.2);border-radius:10px;padding:8px 4px}.fc .e{font-size:28px}.fc small{display:block;color:var(--dim)}
.drv{display:flex;gap:14px;align-items:center}.drv svg{flex:none;color:var(--txt)}
.di{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.di em{font-style:normal;color:var(--acc)}.di small{color:var(--dim)}.di .btn{align-self:flex-start;height:26px;font-size:12px;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font:13px var(--fm)}.kv span:nth-child(odd){color:var(--dim)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.mg canvas{width:100%;height:110px;display:block}
.mg .big{font:700 26px var(--fd)}
.pt{width:100%;border-collapse:collapse;font:13px var(--fm)}.pt td,.pt th{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(var(--rgb),.12)}.pt th{color:var(--acc);font-weight:600}
.term{flex:1;display:flex;flex-direction:column;background:rgba(0,0,0,.42);font:14px/1.5 var(--fm);padding:10px;min-height:0}
.term .to{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word}.term .tl{display:flex;gap:8px;padding-top:6px}
.term .tl input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ok);font:inherit}.tp{color:var(--acc)}.term pre{margin:0;color:var(--acc);font:inherit}
.pcw{flex:1;min-height:0;position:relative}.pcw canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}.sw.on{border-color:#fff;box-shadow:0 0 14px currentColor}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.set label{min-width:120px;color:var(--dim)}
.set input[type=range]{accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:90;background:var(--glass);border:1px solid var(--acc);border-radius:20px;padding:8px 18px;font:13px var(--fm);opacity:0;transition:.3s;pointer-events:none;backdrop-filter:blur(10px)}
#toast.on{opacity:1;transform:translateX(-50%)}
#boot{position:fixed;inset:0;z-index:100;background:#02040a;display:flex;align-items:center;justify-content:center;transition:opacity .7s;padding:20px}
#boot.off{opacity:0;pointer-events:none}
.bc{width:min(440px,100%);text-align:center}
.bc h1{font:900 clamp(26px,8vw,38px) var(--fd);letter-spacing:.3em;margin:6px 0 16px;text-shadow:0 0 24px rgba(var(--rgb),.8)}.bc h1 span{color:var(--acc)}
#bootlog{text-align:left;font:12px/1.7 var(--fm);color:var(--acc);height:130px;overflow:hidden;margin-bottom:12px}
.bp{height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.bp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 14px var(--acc);transition:width .3s}

@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:860px){
 #app{grid-template-columns:1fr;grid-template-rows:46px 1fr 66px;grid-template-areas:"top" "main" "dock"}
 #dock{flex-direction:row;padding:0 10px;border-right:0;border-top:1px solid rgba(var(--rgb),.25);overflow-x:auto;overflow-y:hidden;gap:4px;justify-content:flex-start}
 #dock>:first-child{margin-left:auto}#dock>:last-child{margin-right:auto}
 #dock .dsep{width:1px;height:30px;margin:0 2px}
 #dock button.on::before{left:14px;top:auto;bottom:-9px;width:20px;height:3px}
 input,select{font-size:16px}
}
@media (max-width:560px){.tapp{display:none}.logo{letter-spacing:.18em}#home{padding:12px}}

 .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none;min-width:0;min-height:0;border-width:0}
 .win::before{display:none}.wh{cursor:default}.wh [data-a=max]{display:none}
}
@media (max-height:520px) and (min-width:861px){#app{grid-template-columns:64px 1fr}#dock button{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){.ring1,.ring2{animation:none}.win{animation:none}}
</style>

<body>
<div class="glow-bg"></div><canvas id="bg"></canvas>
<div id="app">
 <header id="top">
  <div class="logo">NEXUS<span>//</span>OS</div><div class="tapp" id="tapp">Escritorio</div><i class="sp"></i>
  <span class="chip" id="tnet"><i></i>RED</span><span class="chip" id="tbat">PWR</span><span class="chip" id="tclock">00:00:00</span>
  <button class="chip" id="tfs" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
 </header>
 <nav id="dock" aria-label="Aplicaciones"></nav>
 <main id="main"><div id="home"></div><div id="wins"></div></main>
</div>
<div id="toast"></div>
<div id="boot"><div class="bc">
 <svg viewBox="0 0 120 120" width="120" height="120"><g fill="none" stroke="#00e5ff" stroke-width="2"><circle class="ring1" cx="60" cy="60" r="52" stroke-dasharray="40 20 8 20"/><circle class="ring2" cx="60" cy="60" r="38" stroke="#b46bff" stroke-dasharray="18 12"/><circle cx="60" cy="60" r="22" opacity=".6"/><path d="M60 44v32M44 60h32" opacity=".8"/></g></svg>
 <h1>NEXUS<span>//</span>OS</h1><div id="bootlog"></div><div class="bp"><i id="bootbar"></i></div><small>TOCA PARA OMITIR</small>
</div></div>

<script>
'use strict';
/* ===================== Utilidades ===================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('nx_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nx_'+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const fmtB=b=>{const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return (b>=100||i===0?b.toFixed(0):b.toFixed(1))+' '+u[i]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],DIAS3=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

 const stroke=(x,y)=>{g.lineCap='round';g.lineJoin='round';g.strokeStyle=erase?BG:$('.pc',b).value;g.lineWidth=+$('.ps',b).value;g.beginPath();g.moveTo(lx,ly);g.lineTo(x+.01,y);g.stroke();lx=x;ly=y};
 c.addEventListener('pointermove',e=>{if(down){const[x,y]=pos(e);stroke(x,y)}});
 c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
 b.addEventListener('click',e=>{const t=e.target.closest('button[data-x]');if(!t)return;const x=t.dataset.x;
  if(x==='pen')erase=false;if(x==='er')erase=true;if(x==='clr'){g.fillStyle=BG;g.fillRect(0,0,c.width,c.height)}
  if(x==='png')c.toBlob(bl=>{const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='lienzo.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)})})}};

/* ===================== Aplicación: Ajustes ===================== */
APPS.settings={name:'Ajustes',w:520,h:560,init(b,el,ctx){
 const draw=()=>{b.innerHTML='<div class="scroll"><div class="card"><h4>Color de acento</h4><div class="set">'+Object.entries(COLORS).map(([n,c])=>'<button class="sw'+(cfg.acc===c?' on':'')+'" style="background:'+c+';color:'+c+'" data-c="'+c+'" title="'+n+'" aria-label="'+n+'"></button>').join('')+'</div></div>'+
 '<div class="card"><h4>Fondo animado</h4><div class="set"><button class="btn" data-w="net">Red neuronal</button><button class="btn" data-w="matrix">Matrix</button><button class="btn" data-w="aurora">Aurora</button></div></div>'+
 '<div class="card"><h4>Efectos</h4><div class="set"><label>Desenfoque cristal</label><input type="range" min="0" max="30" value="'+cfg.blur+'" data-r="blur"></div><div class="set" style="margin-top:10px"><label>Animaciones</label><button class="btn" data-t="anim">'+(cfg.anim?'Activadas':'Desactivadas')+'</button></div><div class="set" style="margin-top:10px"><label>Líneas de escaneo</label><button class="btn" data-t="scan">'+(cfg.scan?'Activadas':'Desactivadas')+'</button></div></div>'+
 '<div class="card"><h4>Sistema</h4><div class="set"><button class="btn" data-s="fs">Pantalla completa</button><button class="btn" data-s="boot">Reiniciar</button><button class="btn" data-s="wipe" style="color:var(--bad)">Borrar datos</button></div><p class="dim"><small>NEXUS//OS 7.2 · tus documentos y ajustes se guardan solo en este navegador.</small></p></div></div>'};
 draw();
 b.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.c){cfg.acc=t.dataset.c;applyCfg();draw()}
  if(t.dataset.w){cfg.wall=t.dataset.w;applyCfg()}
  if(t.dataset.t){cfg[t.dataset.t]=!cfg[t.dataset.t];applyCfg();draw()}
  if(t.dataset.s==='fs')toggleFS();if(t.dataset.s==='boot')boot(false);
  if(t.dataset.s==='wipe'&&confirm('¿Borrar documentos, hojas y ajustes guardados?')){Object.keys(localStorage).filter(k=>k.startsWith('nx_')).forEach(k=>localStorage.removeItem(k));location.reload()}});
 b.addEventListener('input',e=>{if(e.target.dataset.r==='blur'){cfg.blur=+e.target.value;applyCfg()}})}};

/* ===================== Escritorio (widgets) ===================== */
function calHTML(y,m){const f=new Date(y,m,1),start=(f.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),t=new Date();
 let h='<div class="cal">'+['L','M','X','J','V','S','D'].map(d=>'<b>'+d+'</b>').join('');for(let i=0;i<start;i++)h+='<i></i>';
 for(let d=1;d<=dim;d++)h+='<span'+(t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d?' class="today"':'')+'>'+d+'</span>';return h+'</div>'}
const ORDER=['writer','sheets','calc','weather','drives','monitor','terminal','paint','settings'];
function buildHome(){
 $('#home').innerHTML='<div class="wg">'+
 '<div class="card clk"><h4>Tiempo</h4><div class="big" id="wc">00:00</div><div class="dt" id="wd"></div><div class="up" id="wu"></div></div>'+
 '<div class="card" id="wW" style="cursor:pointer"><h4>Clima</h4><div class="wrow"><span class="em">⛅</span><div><div class="tt">--°</div><small class="dim">Cargando…</small></div></div><small class="dim"></small></div>'+
 '<div class="card" id="wS"><h4>Sistema</h4>'+['CPU','RAM','RED'].map(k=>'<div class="row"><div class="l"><span>'+k+'</span><span></span></div><div class="bar"><i></i></div></div>').join('')+'</div>'+
 '<div class="card" id="wD" style="cursor:pointer"><h4>Almacenamiento</h4><div class="rings">'+DR.slice(0,3).map(d=>'<div>'+ring(d.used,colFor(d.used),64)+'<br>'+d.l+'</div>').join('')+'</div></div>'+
 '<div class="card" id="wK"><div class="ch2"><button data-d="-1">‹</button><b></b><button data-d="1">›</button></div><div class="cb"></div></div></div>'+
 '<div class="launch">'+ORDER.map(id=>'<button data-id="'+id+'">'+svg(id,34)+'<span>'+APPS[id].name+'</span></button>').join('')+'</div>';
 let cm=new Date().getMonth(),cy=new Date().getFullYear();
 const kal=()=>{$('#wK b').textContent=MESES[cm]+' '+cy;$('#wK .cb').innerHTML=calHTML(cy,cm)};kal();
 $('#wK').addEventListener('click',e=>{const t=e.target.closest('button[data-d]');if(!t)return;cm+=+t.dataset.d;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}kal()});
 $('#wW').onclick=()=>openApp('weather');$('#wD').onclick=()=>openApp('drives');
 $('.launch').onclick=e=>{const t=e.target.closest('button[data-id]');if(t)openApp(t.dataset.id)};
 const wRender=()=>{if(!W)return;const[d,e]=wxi(W.code,W.day);const c=$('#wW');$('.em',c).textContent=e;$('.tt',c).textContent=Math.round(W.t)+'°C';$('.wrow small',c).textContent=d;c.lastElementChild.textContent=W.name+' · sens. '+Math.round(W.fl)+'° · hum. '+Math.round(W.h)+'%'};
 bus.addEventListener('weather',wRender);wRender();
 bus.addEventListener('sys',()=>{const v=[sys.cpu,sys.ram,sys.net],u=['%','%',' Mb/s'];$$('#wS .row').forEach((r,i)=>{$('span:last-child',r).textContent=v[i].toFixed(0)+u[i];$('i',r).style.width=v[i]+'%'})})}

/* ===================== Dock, barra superior, arranque ===================== */
function buildDock(){
 $('#dock').innerHTML='<button class="home" title="Escritorio" aria-label="Escritorio">'+svg('home')+'</button><span class="dsep"></span>'+ORDER.map(id=>'<button data-id="'+id+'" title="'+APPS[id].name+'" aria-label="'+APPS[id].name+'">'+svg(id)+'</button>').join('');
 $('#dock').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('home')){for(const k in wins)wins[k].el.classList.add('min');act=null;refreshDock();return}
  const id=b.dataset.id,w=wins[id];if(w&&!w.el.classList.contains('min')&&act===id)minWin(id);else openApp(id)}}
function clock(){const d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes());$('#tclock').textContent=t+':'+pad(d.getSeconds());
 const wc=$('#wc');if(wc){wc.textContent=t;$('#wd').textContent=DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();$('#wu').textContent='UPTIME '+uptime()}}
function netStat(){const t=$('#tnet');t.classList.toggle('off',!navigator.onLine);t.innerHTML='<i></i>'+(navigator.onLine?'EN LÍNEA':'OFFLINE')}
addEventListener('online',netStat);addEventListener('offline',netStat);
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>{$('#tbat').textContent=(b.charging?'⚡ ':'🔋 ')+Math.round(b.level*100)+'%'};f();b.addEventListener('levelchange',f);b.addEventListener('chargingchange',f)}).catch(()=>{$('#tbat').textContent='PWR AC'});
else $('#tbat').textContent='PWR AC';
function toggleFS(){const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>toast('Pantalla completa no disponible'));else toast('Pantalla completa no disponible')}
$('#tfs').onclick=toggleFS;

const BL=['NEXUS KERNEL 7.2.1 — inicializando núcleo cuántico','Montando unidades de almacenamiento… OK','Cargando red neuronal de interfaz… OK','Calibrando pantalla holográfica… OK','Sincronizando módulos de energía… OK','Iniciando servicios del sistema… OK','Bienvenido, operador.'];
let bootT=null;
function bootDone(){clearTimeout(bootT);const b=$('#boot');b.classList.add('off');setTimeout(()=>{b.style.display='none'},750)}
function boot(fast){const b=$('#boot'),log=$('#bootlog'),bar=$('#bootbar');clearTimeout(bootT);b.style.display='flex';requestAnimationFrame(()=>b.classList.remove('off'));log.innerHTML='';bar.style.width='0';let i=0;
 const step=()=>{if(i<BL.length){log.insertAdjacentHTML('beforeend','<div>› '+BL[i]+'</div>');bar.style.width=((i+1)/BL.length*100)+'%';i++;bootT=setTimeout(step,fast?110:330)}else bootT=setTimeout(bootDone,fast?200:600)};step()}
$('#boot').addEventListener('pointerdown',bootDone);addEventListener('keydown',e=>{if(!$('#boot').classList.contains('off'))bootDone()});

/* ===================== Inicio ===================== */
applyCfg();bgResize();requestAnimationFrame(loop);
buildDock();buildHome();clock();netStat();setInterval(clock,1000);setInterval(sysTick,1000);sysTick();
W=demoW();bus.dispatchEvent(new Event('weather'));
const loc=store.get('wloc',null);
if(loc)loadWeather(loc.lat,loc.lon,loc.name);else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>loadWeather(p.coords.latitude,p.coords.longitude,'Mi ubicación'),()=>{},{timeout:8000});
boot(false);
</script>
